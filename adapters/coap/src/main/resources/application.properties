${quarkus.application.properties}

# The Quarkus Redis extension creates its client when the application starts, even if cluster
# mode is disabled, and fails to start if no host is configured. The client does not connect
# until a command is sent, which only happens in cluster mode. This placeholder lets the adapter
# start without Redis configuration. In cluster mode, the adapter refuses to start until
# hono.cache.redis.hosts is set.
quarkus.redis.hosts=redis://hono-coap-cache-not-configured:6379
# Readiness must not depend on Redis when cluster mode is disabled.
quarkus.redis.health.enabled=false
